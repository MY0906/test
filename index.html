<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>筆跡浮き出し・消滅実験</title>
  <style>
    body {
      margin: 0;
      background-color: #050505; /* 暗い背景 */
      overflow: hidden;
      touch-action: none; /* スクロール防止 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script>
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  // キャンバスサイズを画面全体に合わせる
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let strokes = [];
  let currentStroke = [];
  let isDrawing = false;

  // 1. 一番最初と同じ単純な Pointer Events（Apple Pencil・タッチ対応）
  canvas.addEventListener('pointerdown', (e) => {
    isDrawing = true;
    currentStroke = [];
    addPoint(e);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    addPoint(e);
  });

  canvas.addEventListener('pointerup', () => {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0) {
      strokes.push({
        points: currentStroke,
        opacity: 0,       // 0からスタート（透明）
        state: 'fadeIn'   // 最初は「浮き出る」モード
      });
    }
  });

  function addPoint(e) {
    const pressure = e.pressure > 0 ? e.pressure : 0.5;
    currentStroke.push({
      x: e.clientX,
      y: e.clientY,
      pressure: pressure
    });
  }

  // 2. 描画・アニメーションループ
  function animate() {
    ctx.fillStyle = 'rgba(5, 5, 5, 1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 【描画中】手応え用のうっすらしたガイド線
    if (isDrawing && currentStroke.length > 1) {
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < currentStroke.length - 1; i++) {
        ctx.moveTo(currentStroke[i].x, currentStroke[i].y);
        ctx.lineTo(currentStroke[i+1].x, currentStroke[i+1].y);
      }
      ctx.stroke();
    }

    // 【書き終わり後】「浮かび上がって ➔ ゆっくり消える」処理
    for (let i = strokes.length - 1; i >= 0; i--) {
      let stroke = strokes[i];

      // --- 透明度（opacity）のコントロール ---
      if (stroke.state === 'fadeIn') {
        stroke.opacity += 0.02; // じわっと浮き出る
        if (stroke.opacity >= 1.0) {
          stroke.opacity = 1.0;
          stroke.state = 'fadeOut'; // くっきり出たら「消えるモード」に切り替え
        }
      } else if (stroke.state === 'fadeOut') {
        stroke.opacity -= 0.005; // ゆっくり消える（小さくすると長く残ります）
        if (stroke.opacity <= 0) {
          strokes.splice(i, 1); // 完全に消えたらデータ削除
          continue;
        }
      }

      // --- 筆跡の描画 ---
      ctx.shadowBlur = 15;
      ctx.shadowColor = `rgba(100, 200, 255, ${stroke.opacity})`; // 水色に光る
      ctx.strokeStyle = `rgba(255, 255, 255, ${stroke.opacity})`;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const points = stroke.points;
      for (let j = 0; j < points.length - 1; j++) {
        ctx.beginPath();
        ctx.lineWidth = points[j].pressure * 12 + 1;
        ctx.moveTo(points[j].x, points[j].y);
