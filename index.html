<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>筆跡浮き出し・消滅実験</title>
  <style>
    body {
      margin: 0;
      background-color: #050505; /* 暗い背景 */
      overflow: hidden;
      touch-action: none; /* ブラウザのスクロールを無効化 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script>
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  // キャンバスサイズを画面全体に合わせる
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let strokes = [];
  let currentStroke = [];
  let isDrawing = false;

  // --- イベント処理（iPadOS・Apple Pencil対策） ---
  function startDrawing(e) {
    isDrawing = true;
    currentStroke = [];
    addPoint(e);
  }

  function drawMove(e) {
    if (!isDrawing) return;
    addPoint(e);
  }

  function finishDrawing() {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0) {
      strokes.push({
        points: currentStroke,
        createdAt: Date.now() // 書き終えた時刻（ミリ秒）
      });
    }
  }

  function addPoint(e) {
    const pressure = e.pressure > 0 ? e.pressure : 0.5;
    currentStroke.push({
      x: e.clientX,
      y: e.clientY,
      pressure: pressure
    });
  }

  // Pointer Events（離脱イベントも補正）
  canvas.addEventListener('pointerdown', startDrawing);
  canvas.addEventListener('pointermove', drawMove);
  canvas.addEventListener('pointerup', finishDrawing);
  canvas.addEventListener('pointercancel', finishDrawing);
  canvas.addEventListener('pointerleave', finishDrawing);

  // --- 描画・アニメーションループ ---
  function animate() {
    // 画面全体の塗りつぶし
    ctx.fillStyle = 'rgba(5, 5, 5, 1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 【描画中】手応え用のうっすらしたリアルタイムガイド線
    if (isDrawing && currentStroke.length > 1) {
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < currentStroke.length - 1; i++) {
        ctx.moveTo(currentStroke[i].x, currentStroke[i].y);
        ctx.lineTo(currentStroke[i+1].x, currentStroke[i+1].y);
      }
      ctx.stroke();
    }

    const now = Date.now();
    const fadeInDuration = 1000;  // 浮き出る時間（1秒）
    const fadeOutDuration = 3000; // 消滅にかかる時間（3秒）

    // 【書き終わり後】時間経過によるフェード処理 ＋ ベジェ曲線描画
    for (let i = strokes.length - 1; i >= 0; i--) {
      let stroke = strokes[i];
      let elapsed = now - stroke.createdAt; // 経過時間

      let opacity = 0;

      if (elapsed < fadeInDuration) {
        // 0〜1秒：徐々に浮き出る
        opacity = elapsed / fadeInDuration;
      } else if (elapsed < fadeInDuration + fadeOutDuration) {
        // 1〜4秒：徐々に消える
        opacity = 1.0 - ((elapsed - fadeInDuration) / fadeOutDuration);
      } else {
        // 4秒経過で配列から完全除去
        strokes.splice(i, 1);
        continue;
      }

      // 発光グラフィックのスタイル設定
      ctx.shadowBlur = 15;
      ctx.shadowColor = `rgba(100, 200, 255, ${opacity})`;
      ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const points = stroke.points;

      // --- 滑らかな線を描くベジェ曲線補間ロジック ---
      if (points.length < 3) {
