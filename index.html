<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>筆跡浮き出し・消滅実験</title>
  <style>
    body {
      margin: 0;
      background-color: #050505; /* 暗い背景 */
      overflow: hidden;
      touch-action: none; /* ブラウザのスクロールを無効化 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script>
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  // キャンバスサイズを画面全体に合わせる
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let strokes = []; // 書いたすべての筆跡データ
  let currentStroke = []; // 現在描いている線のデータ
  let isDrawing = false;

  // 1. Pointer Event（Apple Pencilの筆圧・座標を取得）
  canvas.addEventListener('pointerdown', (e) => {
    isDrawing = true;
    currentStroke = [];
    addPoint(e);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    addPoint(e);
  });

  canvas.addEventListener('pointerup', () => {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0) {
      strokes.push({
        points: currentStroke,
        opacity: 0,       // 最初は透明（0）からスタート
        state: 'fadeIn'   // 「浮かび上がり中」の状態から開始
      });
    }
  });

  function addPoint(e) {
    // 座標と筆圧（e.pressure）を取得
    const pressure = e.pressure > 0 ? e.pressure : 0.5; // 筆圧が取れない場合は0.5
    currentStroke.push({
      x: e.clientX,
      y: e.clientY,
      pressure: pressure
    });
  }

  // 2. 描画・アニメーションループ（約60fpsで動き続ける）
  function animate() {
    // 画面全体を少し黒で塗りつぶす（残像を残す効果）
    ctx.fillStyle = 'rgba(5, 5, 5, 1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 【描画中】リアルタイムで描いている手応え用のガイド線（うっすら表示）
    if (isDrawing && currentStroke.length > 1) {
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < currentStroke.length - 1; i++) {
        ctx.moveTo(currentStroke[i].x, currentStroke[i].y);
        ctx.lineTo(currentStroke[i+1].x, currentStroke[i+1].y);
      }
      ctx.stroke();
    }

    // 【書き終わり後】「じわっと浮かび上がり ➔ ゆっくり消える」処理
    // 配列の後ろからループすることで、透明になったデータを安全に消去できます
    for (let i = strokes.length - 1; i >= 0; i--) {
      let stroke = strokes[i];

      // --- フェードイン（浮き出る）とフェードアウト（消える）の制御 ---
      if (stroke.state === 'fadeIn') {
        stroke.opacity += 0.015; // 浮き出るスピード
        if (stroke.opacity >= 1.0) {
          stroke.opacity = 1.0;
          stroke.state = 'fadeOut'; // 完全に浮き出たら消えるモードに切り替え
        }
      } else if (stroke.state === 'fadeOut') {
        stroke.opacity -= 0.005; // ゆっくり消えていくスピード
        if (stroke.opacity <= 0) {
          strokes.splice(i, 1); // 完全に消えたら配列から削除（動作低下を防ぐ）
          continue;
        }
      }

      // 筆跡の描画（ネオン・発光のような表現）
      ctx.shadowBlur = 15; // 光の滲み（ブラー）効果
      ctx.shadowColor = `rgba(100, 200, 255, ${stroke.opacity})`; // 水色に光る
      ctx.strokeStyle = `rgba(255, 255, 255, ${stroke.opacity})`;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const points = stroke.points;
      for (let j = 0; j < points.length - 1; j++) {
        ctx.beginPath();
        ctx.lineWidth = points[j].pressure * 12 + 1; // 筆圧に応じて線の太さを変える
