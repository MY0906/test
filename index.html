<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>筆跡実験</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #050505;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script>
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  let strokes = [];
  let currentStroke = [];
  let isDrawing = false;

  // --- イベント取得（Pointer Events） ---
  function handleStart(x, y, pressure) {
    isDrawing = true;
    currentStroke = [];
    addPoint(x, y, pressure);
  }

  function handleMove(x, y, pressure) {
    if (!isDrawing) return;
    addPoint(x, y, pressure);
  }

  function handleEnd() {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0) {
      strokes.push({
        points: currentStroke,
        opacity: 0,
        state: 'fadeIn'
      });
    }
  }

  function addPoint(x, y, pressure) {
    const p = (pressure && pressure > 0) ? pressure : 0.5;
    currentStroke.push({ x: x, y: y, pressure: p });
  }

  // Pointer Event リスナー（Apple Pencil / マウス）
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleStart(e.clientX, e.clientY, e.pressure);
  }, { passive: false });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    e.preventDefault();
    handleStart ? handleMove(e.clientX, e.clientY, e.pressure) : null;
  }, { passive: false });

  window.addEventListener('pointerup', () => handleEnd());
  window.addEventListener('pointercancel', () => handleEnd());

  // --- 描画ループ ---
  function animate() {
    ctx.fillStyle = 'rgba(5, 5, 5, 1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 描画中のガイド線
    if (isDrawing && currentStroke.length > 1) {
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < currentStroke.length - 1; i++) {
        ctx.moveTo(currentStroke[i].x, currentStroke[i].y);
        ctx.lineTo(currentStroke[i+1].x, currentStroke[i+1].y);
      }
      ctx.stroke();
    }

    // アニメーション（フェードイン -> フェードアウト）
    for (let i = strokes.length - 1; i >= 0; i--) {
      let stroke = strokes[i];

      if (stroke.state === 'fadeIn') {
        stroke.opacity += 0.02;
        if (stroke.opacity >= 1.0) {
          stroke.opacity = 1.0;
          stroke.state = 'fadeOut';
        }
      } else if (stroke.state === 'fadeOut') {
        stroke.opacity -= 0.005; // ゆっくり消去
        if (stroke.opacity <= 0) {
          strokes.splice(i, 1);
          continue;
        }
      }

      ctx.shadowBlur = 12;
      ctx.shadowColor = `rgba(100, 200, 255, ${stroke.opacity})`;
      ctx.strokeStyle = `rgba(255, 255, 255, ${stroke.opacity})`;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const points = stroke.points;
      for (let j = 0; j < points.length - 1; j++) {
        ctx.beginPath();
        ctx.lineWidth = points[j].pressure * 10 + 1;
        ctx.moveTo(points[j].x, points[j].y);
        ctx.lineTo(points[j+1].x, points[j+1].y);
        ctx.stroke();
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
