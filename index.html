<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>筆跡浮き出し実験</title>
  <style>
    body {
      margin: 0;
      background-color: #050505; /* 暗い背景 */
      overflow: hidden;
      touch-action: none; /* ブラウザのスクロールを無効化 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script>
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  // キャンバスサイズを画面全体に合わせる
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let strokes = []; // 書いたすべての筆跡データ
  let currentStroke = []; // 現在描いている線のデータ
  let isDrawing = false;

  // 1. Pointer Event（Apple Pencilの筆圧・座標を取得）
  canvas.addEventListener('pointerdown', (e) => {
    isDrawing = true;
    currentStroke = [];
    addPoint(e);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    addPoint(e);
  });

  canvas.addEventListener('pointerup', () => {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0) {
      strokes.push({
        points: currentStroke,
        opacity: 0 // 最初は透明（0）からスタート
      });
    }
  });

  function addPoint(e) {
    // 座標と筆圧（e.pressure）を取得
    const pressure = e.pressure > 0 ? e.pressure : 0.5; // 筆圧が取れない場合は0.5
    currentStroke.push({
      x: e.clientX,
      y: e.clientY,
      pressure: pressure
    });
  }

  // 2. 描画・アニメーションループ（約60fpsで動き続ける）
  function animate() {
    // 画面全体を少し黒で塗りつぶす（残像を残す効果）
    ctx.fillStyle = 'rgba(5, 5, 5, 1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 【描画中】リアルタイムで描いている手応え用のガイド線（うっすら表示）
    if (isDrawing && currentStroke.length > 1) {
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < currentStroke.length - 1; i++) {
        ctx.moveTo(currentStroke[i].x, currentStroke[i].y);
        ctx.lineTo(currentStroke[i+1].x, currentStroke[i+1].y);
      }
      ctx.stroke();
    }

    // 【書き終わり後】「じわっと浮かび上がる」アニメーション処理
    for (let stroke of strokes) {
      // 透明度（opacity）を少しずつ上げて「浮かび上がらせる」
      if (stroke.opacity < 1.0) {
        stroke.opacity += 0.015; // ここを小さくすると、よりじわっとゆっくり浮かび上がります
      }

      // 筆跡の描画（ネオン・発光のような表現）
      ctx.shadowBlur = 15; // 光の滲み（ブラー）効果
      ctx.shadowColor = `rgba(100, 200, 255, ${stroke.opacity})`; // 水色に光る
      ctx.strokeStyle = `rgba(255, 255, 255, ${stroke.opacity})`;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const points = stroke.points;
      for (let i = 0; i < points.length - 1; i++) {
        ctx.beginPath();
        ctx.lineWidth = points[i].pressure * 12 + 1; // 筆圧に応じて線の太さを変える
        ctx.moveTo(points[i].x, points[i].y);
        ctx.lineTo(points[i+1].x, points[i+1].y);
        ctx.stroke();
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
