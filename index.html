<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>筆跡浮き出し・消滅実験</title>
  <style>
    body {
      margin: 0;
      background-color: #050505; /* 暗い背景 */
      overflow: hidden;
      touch-action: none; /* ブラウザのスクロールを無効化 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script>
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let strokes = [];
  let currentStroke = [];
  let isDrawing = false;

  // --- イベント処理 ---
  function startDrawing(e) {
    isDrawing = true;
    currentStroke = [];
    addPoint(e);
  }

  function drawMove(e) {
    if (!isDrawing) return;
    addPoint(e);
  }

  function finishDrawing() {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0) {
      // 筆圧の平均値を計算してストローク全体の滑らかな太さとする
      const avgPressure = currentStroke.reduce((acc, p) => acc + p.pressure, 0) / currentStroke.length;
      strokes.push({
        points: currentStroke,
        lineWidth: avgPressure * 10 + 2, // 平均筆圧に基づく太さ
        createdAt: Date.now()
      });
    }
  }

  function addPoint(e) {
    const pressure = e.pressure > 0 ? e.pressure : 0.5;
    currentStroke.push({
      x: e.clientX,
      y: e.clientY,
      pressure: pressure
    });
  }

  canvas.addEventListener('pointerdown', startDrawing);
  canvas.addEventListener('pointermove', drawMove);
  canvas.addEventListener('pointerup', finishDrawing);
  canvas.addEventListener('pointercancel', finishDrawing);
  canvas.addEventListener('pointerleave', finishDrawing);

  // --- アニメーションループ ---
  function animate() {
    ctx.fillStyle = 'rgba(5, 5, 5, 1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 【描画中】リアルタイムのシンプルなガイド線
    if (isDrawing && currentStroke.length > 1) {
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.moveTo(currentStroke[0].x, currentStroke[0].y);
      for (let i = 1; i < currentStroke.length; i++) {
        ctx.lineTo(currentStroke[i].x, currentStroke[i].y);
      }
      ctx.stroke();
    }

    const now = Date.now();
    const fadeInDuration = 1000;  // 1秒で浮き出る
    const fadeOutDuration = 3000; // 3秒で消える

    // 【書き終わり後】一筆書きによるシームレスなライン描画
    for (let i = strokes.length - 1; i >= 0; i--) {
      let stroke = strokes[i];
      let elapsed = now - stroke.createdAt;

      let opacity = 0;

      if (elapsed < fadeInDuration) {
        opacity = elapsed / fadeInDuration;
      } else if (elapsed < fadeInDuration + fadeOutDuration) {
        opacity = 1.0 - ((elapsed - fadeInDuration) / fadeOutDuration);
      } else {
        strokes.splice(i, 1);
        continue;
      }

      // 発光・描画スタイルの設定
      ctx.shadowBlur = 15;
      ctx.shadowColor = `rgba(100, 200, 255, ${opacity})`;
      ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
      ctx.lineWidth = stroke.lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const points = stroke.points;

      // ★一筆で繋げるための1つのパス（beginPath 〜 stroke）
      ctx.beginPath();

      if (points.length < 3) {
        // 点や短い線の場合
        ctx.moveTo(points[0].x, points[0].y);
        for (let j = 1; j < points.length; j++) {
          ctx.lineTo(points[j].x, points[j].y);
        }
      } else {
        // 中間点を結ぶなめらかな曲線一筆描き
        ctx.moveTo(points[0].x, points[0].y);
        for (let j = 1; j < points.length - 1; j++) {
          const midX = (points[j].x + points[j + 1].x) / 2;
          const midY = (points[j].y + points[j + 1].y) / 2;
          ctx.quadraticCurveTo(points[j].x, points[j].y, midX, midY);
        }
        // 最後の点まで繋ぐ
        ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      }

      // 1本のストロークに対して1回だけ描画（これで重なりによる点々が完全に消えます）
      ctx.stroke();
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
