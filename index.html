<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>筆跡浮き出し・消滅実験</title>
  <style>
    body {
      margin: 0;
      background-color: #050505;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script>
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let strokes = [];
  let currentStroke = [];
  let isDrawing = false;

  canvas.addEventListener('pointerdown', (e) => {
    isDrawing = true;
    currentStroke = [];
    addPoint(e);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    addPoint(e);
  });

  canvas.addEventListener('pointerup', () => {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0) {
      strokes.push({
        points: currentStroke,
        opacity: 0,        // 現在の透明度
        state: 'fadeIn'    // 状態: 'fadeIn'(浮き出る) -> 'fadeOut'(消えていく)
      });
    }
  });

  function addPoint(e) {
    const pressure = e.pressure > 0 ? e.pressure : 0.5;
    currentStroke.push({
      x: e.clientX,
      y: e.clientY,
      pressure: pressure
    });
  }

  function animate() {
    ctx.fillStyle = 'rgba(5, 5, 5, 1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 描画中のうっすらしたガイド線
    if (isDrawing && currentStroke.length > 1) {
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < currentStroke.length - 1; i++) {
        ctx.moveTo(currentStroke[i].x, currentStroke[i].y);
        ctx.lineTo(currentStroke[i+1].x, currentStroke[i+1].y);
      }
      ctx.stroke();
    }

    // 筆跡アニメーション処理（配列を逆からループして削除可能にする）
    for (let i = strokes.length - 1; i >= 0; i--) {
      let stroke = strokes[i];

      // --- 状態コントロール（フェードイン・フェードアウト） ---
      if (stroke.state === 'fadeIn') {
        stroke.opacity += 0.015; // じわっと浮き出るスピード
        if (stroke.opacity >= 1.0) {
          stroke.opacity = 1.0;
          stroke.state = 'fadeOut'; // くっきり出たら消えるモードへ移行
        }
      } else if (stroke.state === 'fadeOut') {
        stroke.opacity -= 0.005; // ゆっくり消えていくスピード（ここを小さくすると長く残る）
        if (stroke.opacity <= 0) {
          strokes.splice(i, 1); // 完全に透明になったらデータを削除してメモリ開放
          continue;
        }
      }

      // --- 描画処理 ---
      ctx.shadowBlur = 15;
      ctx.shadowColor = `rgba(100, 200, 255, ${stroke.opacity})`;
      ctx.strokeStyle = `rgba(255, 255, 255, ${stroke.opacity})`;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const points = stroke.points;
      for (let j = 0; j < points.length - 1; j++) {
        ctx.beginPath();
        ctx.lineWidth = points[j].pressure * 12 + 1;
        ctx.moveTo(points[j].x, points[j].y);
        ctx.lineTo(points[j+1].x, points[j+1].y);
        ctx.stroke();
      }
    }

    requestAnimationFrame(animate);
  }

  animate
