<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>筆跡浮き出し・消滅実験</title>
  <style>
    body {
      margin: 0;
      background-color: #050505; /* 暗い背景 */
      overflow: hidden;
      touch-action: none; /* ブラウザのスクロールを無効化 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script>
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let strokes = [];
  let currentStroke = [];
  let isDrawing = false;

  // --- イベント処理の強化（iPadOS対策） ---
  function startDrawing(e) {
    isDrawing = true;
    currentStroke = [];
    addPoint(e);
  }

  function drawMove(e) {
    if (!isDrawing) return;
    addPoint(e);
  }

  function finishDrawing() {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0) {
      strokes.push({
        points: currentStroke,
        createdAt: Date.now() // 書き終わった時刻をミリ秒で記録
      });
    }
  }

  function addPoint(e) {
    const pressure = e.pressure > 0 ? e.pressure : 0.5;
    currentStroke.push({
      x: e.clientX,
      y: e.clientY,
      pressure: pressure
    });
  }

  // Pointer Events（離脱イベントも確実にキャッチ）
  canvas.addEventListener('pointerdown', startDrawing);
  canvas.addEventListener('pointermove', drawMove);
  canvas.addEventListener('pointerup', finishDrawing);
  canvas.addEventListener('pointercancel', finishDrawing); // iPad固有のキャンセルの救済
  canvas.addEventListener('pointerleave', finishDrawing);

  // --- 描画・アニメーションループ ---
  function animate() {
    ctx.fillStyle = 'rgba(5, 5, 5, 1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 【描画中】リアルタイムのガイド線
    if (isDrawing && currentStroke.length > 1) {
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < currentStroke.length - 1; i++) {
        ctx.moveTo(currentStroke[i].x, currentStroke[i].y);
        ctx.lineTo(currentStroke[i+1].x, currentStroke[i+1].y);
      }
      ctx.stroke();
    }

    const now = Date.now();
    const fadeInDuration = 1000;  // 浮き出る時間（1秒 = 1000ミリ秒）
    const fadeOutDuration = 3000; // 消滅にかかる時間（3秒 = 3000ミリ秒）

    // 【書き終わり後】時刻計算ベースのフェード処理
    for (let i = strokes.length - 1; i >= 0; i--) {
      let stroke = strokes[i];
      let elapsed = now - stroke.createdAt; // 書き終えてからの経過時間

      let opacity = 0;

      if (elapsed < fadeInDuration) {
        // 0〜1秒：徐々に浮き出る（0.0 -> 1.0）
        opacity = elapsed / fadeInDuration;
      } else if (elapsed < fadeInDuration + fadeOutDuration) {
        // 1〜4秒：徐々に消える（1.0 -> 0.0）
        opacity = 1.0 - ((elapsed - fadeInDuration) / fadeOutDuration);
      } else {
        // 4秒以上経過したらデータ削除
        strokes.splice(i, 1);
        continue;
      }

      // 発光グラフィック描画
      ctx.shadowBlur = 15;
      ctx.shadowColor = `rgba(100, 200, 255, ${opacity})`;
      ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const points = stroke.points;
      for (let j = 0; j < points.length - 1; j++) {
        ctx.beginPath();
        ctx.lineWidth = points[j].pressure * 12 + 1;
        ctx.moveTo(points[j].x, points[j].y);
        ctx.lineTo(points[j+1].x, points[j+1].y);
        ctx.stroke();
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
